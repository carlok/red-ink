name: test

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Chrome, pinned to one release line
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 156
      - run: npm ci
      - run: npm run build:engine
      - name: The committed engine is what a rebuild gives
        run: git diff --exit-code -- lib/babylon.js
      - name: Regression (headless Chrome)
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run regression
      - name: Keep the result file of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-result
          path: regression-result.json
          if-no-files-found: ignore
          retention-days: 7
